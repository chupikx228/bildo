name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/apps/web/src/entities/app-document/lib/codegen.ts"
      - "frontend/apps/web/scripts/codegen-cli.ts"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/apps/web/src/entities/app-document/lib/codegen.ts"
      - "frontend/apps/web/scripts/codegen-cli.ts"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - run: uv python install 3.12

      - run: uv sync --group dev

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src

      - name: Architecture contracts
        run: uv run lint-imports

      - name: Node.js for the cross-generator parity test
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Docker availability (integration tests need it)
        run: docker info

      - name: Tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing
