[project]
name = "bildo-backend"
version = "0.1.0"
description = "Bildo API — FastAPI, PostgreSQL, Arq"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "openai>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy==2.3.0",
    "import-linter==2.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TID",
    "RUF",
    "ASYNC",
    "S",
    "T20",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/conftest.py" = ["S603"]
"src/generation/prompt.py" = ["RUF001"]
"src/chat/prompt.py" = ["RUF001"]
"alembic/**" = ["N999", "E402", "I001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
pretty = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres via testcontainers; skipped when Docker is unavailable",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
show_missing = true
fail_under = 84

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: router → service → repository. Dependencies only point down"
type = "layers"
layers = ["(router)", "(service)", "(repository)", "(models)"]
containers = ["src.apps", "src.chat", "src.codegen", "src.generation", "src.tasks"]

[[tool.importlinter.contracts]]
name = "Dependency Inversion: service doesn't know about SQLAlchemy or FastAPI"
type = "forbidden"
source_modules = [
    "src.apps.service",
    "src.chat.service",
    "src.chat.prompt",
    "src.codegen.service",
    "src.generation.service",
    "src.generation.llm_client",
    "src.generation.model_catalog",
    "src.generation.prompt",
    "src.generation.structured_output",
    "src.tasks.service",
]
forbidden_modules = ["sqlalchemy", "fastapi", "arq"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Task queue abstraction doesn't know about its Arq implementation"
type = "forbidden"
source_modules = ["src.queue.base"]
forbidden_modules = ["arq", "sqlalchemy", "fastapi", "src.queue.arq_queue"]

[[tool.importlinter.contracts]]
name = "Transaction abstraction doesn't know about its SQLAlchemy implementation"
type = "forbidden"
source_modules = ["src.transaction.base"]
forbidden_modules = ["sqlalchemy", "fastapi", "arq", "src.transaction.session_transaction"]

[[tool.importlinter.contracts]]
name = "Domains communicate only through the public layer (service/schemas)"
type = "forbidden"
source_modules = ["src.codegen", "src.generation", "src.chat.service", "src.chat.prompt"]
forbidden_modules = ["src.apps.repository", "src.apps.models"]
allow_indirect_imports = true
